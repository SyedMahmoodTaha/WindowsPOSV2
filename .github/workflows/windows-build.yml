name: Windows Build

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create local account configuration
        shell: pwsh
        env:
          CASHIER_NAME: ${{ secrets.VITE_CASHIER_NAME }}
          CASHIER_USERNAME: ${{ secrets.VITE_CASHIER_USERNAME }}
          CASHIER_PASSWORD: ${{ secrets.VITE_CASHIER_PASSWORD }}
          ADMIN_NAME: ${{ secrets.VITE_ADMIN_NAME }}
          ADMIN_USERNAME: ${{ secrets.VITE_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
        run: |
          $required = @(
            "CASHIER_NAME",
            "CASHIER_USERNAME",
            "CASHIER_PASSWORD",
            "ADMIN_NAME",
            "ADMIN_USERNAME",
            "ADMIN_PASSWORD"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required repository secret for $name"
            }
          }
          $lines = @(
            "VITE_CASHIER_NAME=$env:CASHIER_NAME",
            "VITE_CASHIER_USERNAME=$env:CASHIER_USERNAME",
            "VITE_CASHIER_PASSWORD=$env:CASHIER_PASSWORD",
            "VITE_ADMIN_NAME=$env:ADMIN_NAME",
            "VITE_ADMIN_USERNAME=$env:ADMIN_USERNAME",
            "VITE_ADMIN_PASSWORD=$env:ADMIN_PASSWORD"
          )
          [System.IO.File]::WriteAllLines(".env", $lines, [System.Text.UTF8Encoding]::new($false))

      - name: Build Vite app
        run: npm run build

      - name: Package unpacked Windows app for account verification
        run: npx electron-builder --win dir --x64

      - name: Verify packaged account configuration
        shell: pwsh
        run: |
          $resourceEnv = Get-ChildItem -Path release -Filter ".env" -File -Recurse |
            Where-Object { $_.Directory.Name -eq "resources" } |
            Select-Object -First 1
          if (-not $resourceEnv) {
            throw "The packaged POS is missing resources/.env"
          }
          $contents = Get-Content -Path $resourceEnv.FullName -Raw
          $required = @(
            "VITE_ADMIN_NAME",
            "VITE_ADMIN_USERNAME",
            "VITE_ADMIN_PASSWORD",
            "VITE_CASHIER_NAME",
            "VITE_CASHIER_USERNAME",
            "VITE_CASHIER_PASSWORD"
          )
          foreach ($name in $required) {
            $pattern = "(?m)^" + [regex]::Escape($name) + "=.+$"
            if ($contents -notmatch $pattern) {
              throw "Packaged account configuration is missing $name"
            }
          }

      - name: Package Windows installer
        run: npm run dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lassi-shop-pos-windows-installer
          path: release/Lassi Shop POS Setup *.exe
          if-no-files-found: error

  build-db-viewer-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: DB-Viewer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DB-Viewer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create DB Viewer account configuration
        shell: pwsh
        env:
          ADMIN_NAME: ${{ secrets.VITE_ADMIN_NAME }}
          ADMIN_USERNAME: ${{ secrets.VITE_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.VITE_ADMIN_PASSWORD }}
          CASHIER_NAME: ${{ secrets.VITE_CASHIER_NAME }}
          CASHIER_USERNAME: ${{ secrets.VITE_CASHIER_USERNAME }}
          CASHIER_PASSWORD: ${{ secrets.VITE_CASHIER_PASSWORD }}
        run: |
          $required = @("ADMIN_NAME", "ADMIN_USERNAME", "ADMIN_PASSWORD", "CASHIER_NAME", "CASHIER_USERNAME", "CASHIER_PASSWORD")
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required repository secret for $name"
            }
          }
          $lines = @(
            "VITE_ADMIN_NAME=$env:ADMIN_NAME",
            "VITE_ADMIN_USERNAME=$env:ADMIN_USERNAME",
            "VITE_ADMIN_PASSWORD=$env:ADMIN_PASSWORD",
            "VITE_CASHIER_NAME=$env:CASHIER_NAME",
            "VITE_CASHIER_USERNAME=$env:CASHIER_USERNAME",
            "VITE_CASHIER_PASSWORD=$env:CASHIER_PASSWORD"
          )
          [System.IO.File]::WriteAllLines(".env", $lines, [System.Text.UTF8Encoding]::new($false))

      - name: Build and package DB Viewer
        run: npm run dist

      - name: Upload DB Viewer installer
        uses: actions/upload-artifact@v4
        with:
          name: lassi-shop-db-viewer-windows
          path: DB-Viewer/release/*.exe
          if-no-files-found: error
