<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tyep</title>
  </head>
  <body>
    <div id="startup-splash" aria-label="Loading Tyep">
      <div class="startup-mark">
        <img src="./Logo.png" alt="Tyep" onerror="this.style.display='none'" />
        <span>Tyep</span>
      </div>
    </div>
    <div id="root"></div>
    <style>
      html,body,#root{margin:0;min-height:100%;background:#1f1f1f}
      #startup-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#1f1f1f;color:#f5f5f5;transition:opacity .45s ease,visibility .45s ease}
      #startup-splash.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
      .startup-mark{display:grid;justify-items:center;gap:16px;animation:startup-rise 1.1s cubic-bezier(.22,1,.36,1) both;font:600 20px Georgia,serif;letter-spacing:.04em}
      .startup-mark img{width:min(240px,70vw);height:auto;filter:drop-shadow(0 8px 24px #0008);animation:startup-breathe 1.8s ease-in-out infinite}
      @keyframes startup-rise{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
      @keyframes startup-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
      @media (prefers-reduced-motion:reduce){.startup-mark,.startup-mark img{animation:none}}
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
